# Build profile for CI / clean machines: arduino-cli compile --profile littlecube
# Local builds use scripts/build.sh (plain --fqbn + explicit --library flags,
# which needs NO default_profile here — a default profile would hijack --fqbn
# builds and break the vendored-library path).
profiles:
  littlecube:
    fqbn: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=custom
    platforms:
      - platform: esp32:esp32 (3.3.8)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.6.6)
      - Adafruit GFX Library (1.11.11)
      - Adafruit BusIO (1.17.4)
      - Adafruit XCA9554 (1.0.0)
      - XPowersLib (0.3.3)
      - SensorLib (0.4.1)
      - ArduinoJson (7.4.3)
      - ESP8266Audio (2.4.1)
      - JPEGDEC (1.8.4)
      - dir: ../libraries/Arduino_DriveBus
